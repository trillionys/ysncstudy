# Netlify 빌드 설정 — 저장소 루트가 아니라 cpa-concept-lab-web 폴더가 사이트입니다.
# (Netlify 화면의 Base directory 를 cpa-concept-lab-web 으로 지정하면 이 파일이 적용됩니다.)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Firebase 인증 도우미 경로 프록시 — Firebase 공식 가이드의 "리다이렉트 로그인 모범 사례" 옵션 3.
# 지금은 authDomain 이 cpa-concept-lab.firebaseapp.com 이라 쓰이지 않지만,
# 나중에 authDomain 을 이 사이트 도메인으로 바꾸면(DEPLOY.md 6절) 리다이렉트 로그인이 같은 도메인에서 동작합니다.
[[redirects]]
  from = "/__/auth/*"
  to = "https://cpa-concept-lab.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://cpa-concept-lab.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

# 로그인 팝업이 원래 창과 통신할 수 있도록 고객지원 페이지만 COOP 를 완화
[[headers]]
  for = "/support"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
